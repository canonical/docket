name: CI

on:
  pull_request:
  push:
    branches: [main, ci/release-workflows]
  # The release workflow runs these same gates before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Format, lint and type-check
        run: bun run check

      - name: Type-check the shipped sources
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Test with coverage
        run: bun run test:coverage

  identity:
    name: Identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Self-test the identity check
        run: bun src/scripts/check-identity.ts --self-test

      - name: Check identity
        run: bun run check:identity

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, so it needs the whole history.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

        # The action leaves gitleaks on PATH, which the self-test runs.
      - name: Self-test the secrets check
        run: bun src/scripts/check-secrets.ts --self-test

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Self-test the audit
        run: bun src/scripts/check-audit.ts --self-test

      - name: Audit
        run: bun run check:audit

      - name: Self-test the licence check
        run: bun src/scripts/check-licences.ts --self-test

      - name: Check licences
        run: bun run check:licences

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Self-test the structure check
        run: bun src/scripts/check-structure.ts --self-test

      - name: Check structure
        run: bun run check:structure

  guarantees:
    name: Guarantees
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run the guarantees
        run: bun run guarantees

        # Breaks each entry on purpose: the FAIL lines it prints are expected,
        # and only its last line is the verdict.
      - name: Prove the guarantees fail when broken
        run: bun run guarantees:prove
